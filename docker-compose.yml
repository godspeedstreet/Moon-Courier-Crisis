services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - moon_courier_data:/app/data
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/moon_courier.db
      - PYTHONPATH=/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      # The browser (on the host) reaches the backend via the published port
      - VITE_API_BASE=http://localhost:8000/api
    command: npm run dev -- --host 0.0.0.0

volumes:
  moon_courier_data:
